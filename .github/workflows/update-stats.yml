name: Update problem stats

on:
  push:
    branches:
      - main
    paths:
      - "BOJ/**"
      - "Programmers/**"
      - "SWEA/**"
      - "LeetCode/**"
      - "scripts/update_stats.py"
      - ".github/workflows/update-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-problem-stats
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README statistics
        run: python scripts/update_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "README statistics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update problem stats"
          git push
